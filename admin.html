<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Admin - La Gran Varieté</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        :root { --crimson: #8B0016; --crimson-bright: #C8102E; --gold: #D4AF37; --gold-bright: #FFD166; --dark-bg: #0A0608; }
        body { background: var(--dark-bg); color: #FAF5EE; font-family: 'Arial Black', sans-serif; text-align: center; padding: 16px; margin: 0; }
        .panel { background: rgba(25, 8, 12, 0.92); border: 2px solid var(--gold); box-shadow: 0 0 25px rgba(139, 0, 22, 0.6); border-radius: 12px; padding: 20px; max-width: 820px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; box-sizing: border-box; }
        h1 { font-family: 'Press Start 2P', cursive; font-size: 18px; color: var(--gold-bright); text-shadow: 0 0 12px rgba(212, 175, 55, 0.5); margin: 0 0 10px 0; width: 100%; line-height: 1.4; }
        
        .btn { padding: 14px 10px; font-family: 'Press Start 2P', cursive; font-size: 10px; line-height: 1.5; cursor: pointer; background: rgba(139, 0, 22, 0.2); color: #FAF5EE; border: 2px solid #555; transition: 0.25s; width: 48%; border-radius: 6px; box-sizing: border-box; }
        .btn:hover { background: #331018; }
        .btn-primario { border-color: var(--gold); color: var(--gold-bright); }
        .btn-primario:hover { background: var(--gold); color: #0A0608; }
        .btn-accion { border-color: #FF9F1C; color: #FF9F1C; }
        .btn-accion:hover { background: #FF9F1C; color: #0A0608; }
        .btn-peligro { border-color: #FF4D6D; color: #FF4D6D; }
        .btn-peligro:hover { background: #FF4D6D; color: #fff; }
        .btn-ruleta { border-color: var(--gold-bright); color: var(--gold-bright); background: rgba(212, 175, 55, 0.12); }
        .btn-ruleta:hover { background: var(--gold-bright); color: #0A0608; }
        .btn-qa { border-color: #888; color: #bbb; background: transparent; }

        .stats-box { width: 100%; background: #14080C; border: 1px solid rgba(212, 175, 55, 0.35); padding: 15px; border-radius: 8px; margin-bottom: 6px; box-sizing: border-box; }
        .pin-display { font-size: 32px; font-family: 'Press Start 2P', cursive; color: var(--gold-bright); letter-spacing: 5px; margin: 10px 0 16px 0; text-shadow: 0 0 12px rgba(255, 209, 102, 0.6); }
        .team-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; font-family: 'Press Start 2P', cursive; font-size: 9px; color: #e2d5d8; }
        .team-col { background: #210B11; padding: 12px 6px; border-radius: 6px; border-bottom: 3px solid #555; word-break: break-word; line-height: 1.4; }
        .team-col span { display: block; font-size: 22px; color: #fff; margin-top: 8px; font-family: 'Arial Black', sans-serif; }

        .audio-console { width: 100%; background: rgba(212, 175, 55, 0.08); border: 1px solid var(--gold); padding: 15px; border-radius: 8px; display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 6px; box-sizing: border-box; }
        .slider-container { flex: 1; display: flex; flex-direction: column; align-items: flex-start; }
        .slider-container label { font-family: 'Press Start 2P', cursive; font-size: 10px; color: var(--gold-bright); margin-bottom: 10px; line-height: 1.4; }
        input[type=range] { width: 100%; accent-color: var(--gold); }
        .btn-soundcheck { width: 35%; padding: 12px 8px; border-color: var(--crimson-bright); color: #FAF5EE; background: rgba(139, 0, 22, 0.5); }
        .btn-soundcheck:hover { background: var(--crimson-bright); color: #fff; }

        @media (max-width: 600px) {
            .team-stats { grid-template-columns: repeat(2, 1fr); }
            .btn { width: 100%; }
            .audio-console { flex-direction: column; align-items: stretch; }
            .btn-soundcheck { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="panel">
        <h1>VARIETÉ · CONTROL STAGE</h1>
        
        <div class="stats-box">
            <h3 style="margin-top: 0; color: #bfa6aa; font-family: 'Press Start 2P', cursive; font-size: 11px;">SALA ACTIVA (PIN)</h3>
            <div class="pin-display" id="display-pin">----</div>
            <div class="team-stats" id="team-stats"></div>
        </div>

        <div class="audio-console">
            <div class="slider-container">
                <label>VOLUMEN MÁSTER TV: <span id="vol-val">70</span>%</label>
                <input type="range" id="vol-slider" min="0" max="100" value="70" oninput="actualizarVolumenVisual()" onchange="enviarVolumenFirebase()">
            </div>
            <button class="btn btn-soundcheck" onclick="testSonidoTV()">SOUNDCHECK</button>
        </div>

        <button class="btn btn-primario" onclick="abrirSala()">1. CREAR NUEVA SALA (PIN)</button>
        <button class="btn btn-accion" onclick="mezclarEquipos()">2. MEZCLAR EQUIPOS</button>
        <button class="btn btn-primario" onclick="iniciarCarrera()" style="width: 100%; font-size: 13px; border-color: var(--crimson-bright); background: rgba(139, 0, 22, 0.45); color: var(--gold-bright);">3. INICIAR CARRERA</button>
        
        <button class="btn btn-accion" onclick="devolverLobby()">4. PAUSAR / LOBBY</button>
        <button class="btn btn-peligro" onclick="cerrarSala()">5. CERRAR SALA (EXPULSAR)</button>
        
        <button class="btn btn-ruleta" style="width: 100%; font-size: 14px;" onclick="lanzarRuleta()">6. SORTEAR GANADOR (RULETA)</button>
        
        <h3 style="width: 100%; color: #666; font-size: 10px; font-family: 'Press Start 2P', cursive; margin: 10px 0 0 0; text-align: left;">ZONA DE PRUEBAS TÉCNICAS (QA):</h3>
        <button class="btn btn-qa" onclick="forzarFinal()">FORZAR LLEGADA</button>
        <button class="btn btn-qa" onclick="testLuces()">TEST ANIMACIÓN VICTORIA</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = { apiKey: "AIzaSyAlvRSjQ8HMkYLqWdRnz8sHm6H1anXxNUw", authDomain: "hipodromo-56215.firebaseapp.com", databaseURL: "https://hipodromo-56215-default-rtdb.firebaseio.com", projectId: "hipodromo-56215", storageBucket: "hipodromo-56215.firebasestorage.app", messagingSenderId: "793993929295", appId: "1:793993929295:web:febbad383d625d60c3c03a" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        const NOMBRES_EQUIPOS = { 1: "FORZUDO", 2: "MAGO", 3: "PAYASO", 4: "SR. CORALES" };
        const EQUIPO_IDS = [1, 2, 3, 4];

        onValue(ref(db, 'salaActiva'), (snap) => { document.getElementById('display-pin').innerText = snap.val() || "----"; });

        onValue(ref(db, 'equipos'), (snap) => {
            const datos = snap.val() || {};
            const statsDiv = document.getElementById('team-stats');
            let html = '';
            EQUIPO_IDS.forEach(id => {
                const jgs = (datos[id] && datos[id].jugadores) ? Object.keys(datos[id].jugadores).length : 0;
                let borderColor = jgs > 0 ? '#D4AF37' : '#555';
                html += `<div class="team-col" style="border-bottom-color: ${borderColor}">${NOMBRES_EQUIPOS[id]}<span>${jgs}</span></div>`;
            });
            statsDiv.innerHTML = html;
        });

        window.actualizarVolumenVisual = () => { document.getElementById('vol-val').innerText = document.getElementById('vol-slider').value; };
        window.enviarVolumenFirebase = () => { set(ref(db, 'volumenGlobal'), document.getElementById('vol-slider').value / 100); };
        window.testSonidoTV = () => { set(ref(db, 'triggerSoundcheck'), Date.now()); };

        window.abrirSala = () => {
            if(confirm("¿Crear una sala nueva? Esto borrará el juego actual.")) {
                const pin = Math.floor(1000 + Math.random() * 9000).toString();
                set(ref(db, 'salaActiva'), pin);
                set(ref(db, 'ganadorRuleta'), null); 
                const inicial = {};
                EQUIPO_IDS.forEach(id => { inicial[id] = { clicksTotales: 0, jugadores: null }; });
                set(ref(db, 'equipos'), inicial);
                set(ref(db, 'ganadorAbsoluto'), null);
                set(ref(db, 'clasificacion'), null);
                set(ref(db, 'estado'), 'espera'); 
            }
        };

        window.mezclarEquipos = async () => {
            if(confirm("¿Mezclar a todos los jugadores aleatoriamente?")) {
                const snap = await get(ref(db, 'equipos'));
                const datos = snap.val();
                if(!datos) return;
                
                let todosLosJugadores = [];
                EQUIPO_IDS.forEach(id => {
                    if(datos[id] && datos[id].jugadores) {
                        Object.entries(datos[id].jugadores).forEach(([uid, nombre]) => { todosLosJugadores.push({uid, nombre}); });
                    }
                });

                if(todosLosJugadores.length === 0) {
                    alert("No hay jugadores en la sala para mezclar.");
                    return;
                }

                for (let i = todosLosJugadores.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [todosLosJugadores[i], todosLosJugadores[j]] = [todosLosJugadores[j], todosLosJugadores[i]];
                }

                const nuevosEquipos = {};
                EQUIPO_IDS.forEach(id => { nuevosEquipos[id] = { clicksTotales: 0, jugadores: {} }; });
                
                todosLosJugadores.forEach((jugador, index) => {
                    const eqAsignado = (index % EQUIPO_IDS.length) + 1;
                    nuevosEquipos[eqAsignado].jugadores[jugador.uid] = jugador.nombre;
                });

                set(ref(db, 'equipos'), nuevosEquipos);
                set(ref(db, 'comandoResetCelulares'), Date.now()); 
                
                // Feedback visual de que sí funcionó internamente
                alert("¡Jugadores reasignados con éxito! Los números pueden verse iguales porque se distribuyen de forma perfectamente equitativa.");
            }
        };

        window.iniciarCarrera = () => {
            if(confirm("¿Comenzar cuenta regresiva en todas las pantallas?")) {
                set(ref(db, 'clasificacion'), null); set(ref(db, 'ganadorRuleta'), null);
                set(ref(db, 'estado'), 'cuenta_regresiva');
            }
        };

        window.devolverLobby = () => { if(confirm("¿Devolver a todos a la sala de espera manteniendo equipos?")) set(ref(db, 'estado'), 'espera'); };
        window.cerrarSala = () => { if(confirm("¿Expulsar a todos y reiniciar el sistema por completo?")) { set(ref(db, 'salaActiva'), null); set(ref(db, 'estado'), 'cerrado'); } };
        window.forzarFinal = () => { if(confirm("¿Acelerar a todos los equipos para probar el cierre?")) set(ref(db, 'comandoForzarFinal'), Date.now()); };
        window.testLuces = () => { if(confirm("¿Disparar la animación del ganador en la TV sin correr la carrera?")) set(ref(db, 'triggerTestVictoria'), Date.now()); };
        window.lanzarRuleta = () => { if(confirm("¿Lanzar la ruleta en la TV para elegir a un ganador del equipo campeón?")) set(ref(db, 'triggerRuleta'), Date.now()); };
    </script>
</body>
</html>
