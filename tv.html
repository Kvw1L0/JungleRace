<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>TV Display - La Gran Varieté</title>
    <!-- Script de Confeti para la explosión BTL -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        :root { --crimson: #8B0016; --crimson-bright: #C8102E; --gold: #D4AF37; --gold-bright: #FFD166; --dark-bg: #0A0608; }
        body { background: var(--dark-bg); color: #FAF5EE; font-family: 'Arial Black', sans-serif; margin: 0; overflow: hidden; transition: filter 1s ease-out; }
        
        #pista-container { width: 100vw; height: 100vh; position: relative; background: url('pista.png') center center / cover no-repeat; background-color: #120608; transition: transform 0.8s cubic-bezier(0.25, 0.1, 0.25, 1), filter 2s; will-change: transform; }
        .pista-oscura { filter: brightness(0.2); } 

        #zona-carriles { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; }
        .carril { position: absolute; width: 100%; height: 14vh; display: flex; align-items: center; transform: translateY(-50%); }
        
        .personaje { position: absolute; height: 100%; display: flex; align-items: center; justify-content: center; transform: translateX(-50%); transition: left 0.4s linear, filter 1s; z-index: 10; filter: drop-shadow(0 0 12px rgba(255, 209, 102, 0.45)); }
        .personaje.meta-cruzada { animation: auraMeta 1.4s ease-in-out infinite alternate; }
        @keyframes auraMeta {
            from { filter: drop-shadow(0 0 8px rgba(255, 215, 100, 0.85)) drop-shadow(0 0 16px rgba(255, 255, 255, 0.55)); }
            to { filter: drop-shadow(0 0 14px rgba(255, 230, 130, 1)) drop-shadow(0 0 28px rgba(255, 255, 255, 0.85)); }
        }
        .personaje img { display: block; height: auto; max-height: 16.6vh; width: auto; object-fit: contain; }
        
        .linea-meta { position: absolute; left: 85vw; top: 57vh; bottom: 3vh; width: 4px; background: rgba(255, 209, 102, 0.8); box-shadow: 0 0 16px var(--gold-bright), 0 0 32px var(--crimson-bright); z-index: 1; filter: blur(0.5px); } 
        
        .overlay { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(10, 4, 6, 0.9); display:none; flex-direction:column; justify-content:center; align-items:center; z-index:100; text-align: center; backdrop-filter: blur(5px); }
        
        #pantalla-desbloqueo { display: flex; z-index: 1000; cursor: pointer; }
        #pantalla-desbloqueo h1 { font-family: 'Press Start 2P', cursive; color: var(--gold-bright); text-shadow: 0 0 25px var(--crimson-bright); animation: pulso 1s infinite alternate; }
        
        #titulo-inicio { font-size: 5.5vh; font-family: 'Press Start 2P', cursive; color: var(--gold-bright); text-shadow: 0 0 20px var(--crimson-bright); position: absolute; top: 8vh; width: 100%; text-align: center; margin: 0; z-index: 101;}
        
        /* --- ESTÉTICA GLASSMORPHISM VARIETÉ --- */
        #caja-qr-central { 
            width: 40vw; 
            min-width: 300px;
            height: 55vh; 
            border: 2px solid rgba(212, 175, 55, 0.65); 
            background: rgba(18, 6, 9, 0.72); 
            box-shadow: 0 15px 35px rgba(0,0,0,0.85), inset 0 0 25px rgba(139, 0, 22, 0.35);
            backdrop-filter: blur(15px); 
            border-radius: 25px; 
            position: absolute; 
            top: 52%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            z-index: 101; 
        }
        #pin-display { font-size: 7vh; font-family: 'Press Start 2P', cursive; color: var(--gold-bright); text-shadow: 0 0 20px rgba(255, 209, 102, 0.7); margin-bottom: 20px;}
        
        .marco-qr {
            background: #FAF5EE;
            padding: 1.8vh;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            border: 3px solid var(--gold);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .marco-qr img, .marco-qr canvas {
            width: 26vh !important; 
            height: 26vh !important; 
            border-radius: 4px; 
            display: block;
        }
        /* --------------------------------------- */

        #nubes-nombres { position: absolute; top:0; left:0; width: 100vw; height: 100vh; overflow: hidden; z-index: 100;}
        .nombre-flotante { position: absolute; font-family: 'Press Start 2P', cursive; text-shadow: 2px 2px 0 #000, 0 0 10px rgba(212, 175, 55, 0.35); white-space: nowrap; animation: flotar 5s infinite ease-in-out alternate;}
        @keyframes flotar { 0% { transform: translate(0, 0) scale(1); opacity: 0.65;} 50% { transform: translate(25px, -15px) scale(1.1); opacity: 1;} 100% { transform: translate(-15px, 20px) scale(1); opacity: 0.65;} }

        #contador-tv { font-size: 40vh; font-family: 'Press Start 2P', cursive; color: var(--gold-bright); text-shadow: 0 0 50px var(--crimson-bright); display: none; z-index: 105; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);}
        
        #spotlight-ganador { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 100vw; height: 100vh; background: radial-gradient(circle, rgba(255, 209, 102, 0.25) 0%, rgba(139, 0, 22, 0.5) 35%, transparent 65%); display: none; z-index: 50; flex-direction: column; justify-content: center; align-items: center;}
        #sprite-ganador-gigante img { image-rendering: pixelated; }
        #txt-ganador-epico { font-family: 'Press Start 2P', cursive; font-size: 5vh; color: var(--gold-bright); text-shadow: 0 0 30px var(--crimson-bright), 0 0 60px var(--crimson); margin-top: 5vh; text-align: center; line-height: 1.5; animation: rebote 1s ease-out;}
        @keyframes rebote { 0% { transform: translateY(100px); opacity: 0;} 50% { transform: translateY(-20px); opacity: 1;} 100% { transform: translateY(0); opacity: 1;} }

        #panel-ranking { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 65vw; max-width: 900px; background: rgba(14, 5, 8, 0.94); border: 2px solid var(--gold); box-shadow: 0 0 35px rgba(139, 0, 22, 0.7); border-radius: 15px; display: none; flex-direction: column; padding: 40px; z-index: 60; backdrop-filter: blur(10px);}
        #panel-ranking h2 { font-family: 'Press Start 2P', cursive; font-size: 4vh; color: var(--gold-bright); text-align: center; margin-bottom: 35px; text-shadow: 0 0 12px var(--crimson-bright);}
        .fila-ranking { display: flex; align-items: center; justify-content: space-between; font-family: 'Press Start 2P', cursive; font-size: 2.5vh; color: #FAF5EE; margin-bottom: 22px; border-bottom: 1px dashed #4A1C24; padding-bottom: 15px;}
        .fila-primero { color: var(--gold-bright); font-size: 3.3vh; text-shadow: 0 0 12px var(--gold); border-bottom: 2px solid var(--gold);} 
        @keyframes aparecer { from { opacity: 0; transform: translate(-50%, -40%); } to { opacity: 1; transform: translate(-50%, -50%); } }
        
        #overlay-ruleta { background: rgba(14, 5, 8, 0.8); backdrop-filter: blur(8px); z-index: 105; border: 2px solid rgba(212, 175, 55, 0.5); }
        #titulo-ruleta { color: var(--gold-bright); font-size: 3.8vh; font-family: 'Press Start 2P', cursive; margin-bottom: 40px; text-shadow: 0 0 15px #000; }
        #nombre-ruleta { font-size: clamp(24px, 6vw, 8vh); font-family: 'Press Start 2P', cursive; color: #FAF5EE; text-transform: uppercase; text-shadow: 0 0 20px rgba(255, 209, 102, 0.5), 2px 2px 10px #000; transition: all 0.1s ease; white-space: normal; word-break: break-word; max-width: 90vw; line-height: 1.4; }
        .ruleta-girando { opacity: 0.8; transform: scale(0.98); }
        .ruleta-ganador { color: var(--gold-bright) !important; text-shadow: 0 0 40px var(--crimson-bright), 0 0 80px var(--gold) !important; animation: impactoGanador 0.5s ease-out forwards; }
        @keyframes impactoGanador { 0% { transform: scale(1); } 50% { transform: scale(1.15); } 100% { transform: scale(1.05); } }
        
        #pantalla-limpia { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0A0608; z-index: 999; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; box-sizing: border-box;}
        #pantalla-limpia h2 { font-family: 'Press Start 2P', cursive; color: var(--gold); font-size: 2.2vh; line-height: 1.6;}
        #overlay-inicio { background: rgba(10, 4, 6, 0.88); backdrop-filter: blur(5px); }
    </style>
</head>
<body>
    
    <div id="pantalla-desbloqueo" class="overlay" onclick="desbloquearSistema()">
        <h1>CLICK PARA INICIAR TV<br><br><span style="font-size: 2vh; color:#fff;">(Requerido para Audio)</span></h1>
    </div>

    <div id="pantalla-limpia">
        <h2>ESPERANDO AL ADMINISTRADOR...</h2>
    </div>

    <div id="pista-container">
        <div class="linea-meta"></div>
        <div id="zona-carriles"></div>
    </div>
    
    <div id="spotlight-ganador">
        <div id="sprite-ganador-gigante"></div>
        <div id="txt-ganador-epico"></div>
    </div>
    <div id="panel-ranking">
        <h2>LEADERBOARD</h2>
        <div id="lista-ranking-final"></div>
    </div>

    <!-- SALA DE ESPERA ACTUALIZADA -->
    <div id="overlay-inicio" class="overlay">
        <h1 id="titulo-inicio">SALA DE ESPERA</h1>
        <div id="nubes-nombres"></div>
        
        <div id="caja-qr-central">
            <span style="font-family: 'Arial Black'; font-size: 2vh; color: #ccc; margin-bottom: 10px; letter-spacing: 2px;">PIN DE ACCESO</span>
            <div id="pin-display">----</div>
            <div class="marco-qr" id="qr-dinamico">
                <img src="qr.png" alt="Código QR">
            </div>
        </div>
        
    </div>

    <div id="overlay-ruleta" class="overlay">
        <h2 id="titulo-ruleta">GANADOR EQUIPO CAMPEÓN</h2>
        <div id="nombre-ruleta">BUSCANDO...</div>
    </div>

    <div id="contador-tv">3</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = { apiKey: "AIzaSyAlvRSjQ8HMkYLqWdRnz8sHm6H1anXxNUw", authDomain: "hipodromo-56215.firebaseapp.com", databaseURL: "https://hipodromo-56215-default-rtdb.firebaseio.com", projectId: "hipodromo-56215", storageBucket: "hipodromo-56215.firebasestorage.app", messagingSenderId: "793993929295", appId: "1:793993929295:web:febbad383d625d60c3c03a" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        const EQUIPOS = [
            { id: 1, nombre: "FORZUDO", asset: "forzudo.png", posicionY: "66%", inicioX: 12, finX: 91, escala: 1.0 },
            { id: 2, nombre: "MAGO", asset: "mago.png", posicionY: "72%", inicioX: 12, finX: 91, escala: 1.0 },
            { id: 3, nombre: "PAYASO", asset: "payaso.png", posicionY: "79%", inicioX: 12, finX: 91, escala: 1.2 },
            { id: 4, nombre: "SR. CORALES", asset: "corales.png", posicionY: "88%", inicioX: 12, finX: 91, escala: 1.15 }
        ];
        const COLORES_ESTETICOS = ['#FAF5EE', '#FFD166', '#D4AF37', '#C8102E']; 

        let datosEq = {}, anteriorClicks = {}, posiciones = {};
        let snapshotJugadores = {}; 
        let juegoActivo = false, clasificacion = [];
        let tiempoInicio = 0, tiemposFinales = {}; 
        const LIMITE_META = 91; 

        let volGlobal = 0.7; 
        const audioDrumroll = new Audio('canciones/drumroll.mp3'); audioDrumroll.volume = volGlobal;

        function lanzarConfeti() {
            var duration = 5 * 1000;
            var end = Date.now() + duration;
            (function frame() {
                confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#D4AF37', '#FFD166', '#8B0016', '#FAF5EE'] });
                confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#D4AF37', '#FFD166', '#8B0016', '#FAF5EE'] });
                if (Date.now() < end) { requestAnimationFrame(frame); }
            }());
        }

        onValue(ref(db, 'volumenGlobal'), (snap) => {
            const v = snap.val();
            if(v !== null) {
                volGlobal = v;
                audioDrumroll.volume = volGlobal;
            }
        });

        let ignoreFirstSound = true;
        onValue(ref(db, 'triggerSoundcheck'), (snap) => {
            if(ignoreFirstSound) { ignoreFirstSound = false; return; }
            if(snap.val()) { audioDrumroll.currentTime = 0; audioDrumroll.play().catch(e=>console.log(e)); }
        });

        let ignoreFirstTestVic = true;
        onValue(ref(db, 'triggerTestVictoria'), (snap) => {
            if(ignoreFirstTestVic) { ignoreFirstTestVic = false; return; }
            if(snap.val()) {
                clasificacion = [1,2,3,4]; tiemposFinales = {1:"10.55", 2:"12.10", 3:"14.05", 4:"16.20"};
                animacionFinalPodio();
            }
        });

        window.desbloquearSistema = () => {
            document.getElementById('pantalla-desbloqueo').style.display = 'none';
            document.getElementById('overlay-inicio').style.display = 'flex';
            audioDrumroll.play().then(() => { audioDrumroll.pause(); audioDrumroll.currentTime = 0; }).catch(() => {});
        };

        const zonaCarriles = document.getElementById('zona-carriles');
        EQUIPOS.forEach((eq) => {
            const carril = document.createElement('div');
            carril.className = 'carril'; carril.style.top = eq.posicionY; 
            carril.innerHTML = `<div class="personaje" id="p-${eq.id}" style="left: ${eq.inicioX}vw;"><img src="${eq.asset}" alt="${eq.nombre}" style="transform: scale(${eq.escala}); transform-origin: center center;"></div>`;
            zonaCarriles.appendChild(carril);
            anteriorClicks[eq.id] = 0; posiciones[eq.id] = 0; 
        });

        onValue(ref(db, 'equipos'), (snap) => { 
            datosEq = snap.val() || {}; 
            if(document.getElementById('overlay-inicio').style.display !== 'none') {
                const contenedorNombres = document.getElementById('nubes-nombres');
                contenedorNombres.innerHTML = '';
                
                EQUIPOS.forEach(eq => { 
                    if(datosEq[eq.id] && datosEq[eq.id].jugadores) {
                        Object.values(datosEq[eq.id].jugadores).forEach(nombre => {
                            const span = document.createElement('div');
                            span.className = 'nombre-flotante'; span.innerText = nombre;
                            span.style.color = COLORES_ESTETICOS[Math.floor(Math.random() * COLORES_ESTETICOS.length)];
                            
                            let x, y;
                            const zona = Math.floor(Math.random() * 4);
                            if(zona===0) { x = Math.random()*90; y = Math.random()*20; } 
                            else if(zona===1) { x = Math.random()*90; y = 80 + Math.random()*15; } 
                            else if(zona===2) { x = Math.random()*20; y = 25 + Math.random()*50; } 
                            else { x = 70 + Math.random()*25; y = 25 + Math.random()*50; } 
                            
                            span.style.left = x + 'vw'; span.style.top = y + 'vh';
                            span.style.fontSize = (1.5 + Math.random()*1.5) + 'vh';
                            span.style.animationDelay = (Math.random() * -5) + 's';
                            span.style.animationDuration = (4 + Math.random() * 4) + 's';
                            contenedorNombres.appendChild(span);
                        });
                    }
                });
            }
        });

        onValue(ref(db, 'salaActiva'), (snap) => {
            const pin = snap.val();
            document.getElementById('pin-display').innerText = pin || "----";
            const qrContainer = document.getElementById('qr-dinamico');
            if (pin && typeof QRCode !== 'undefined') {
                qrContainer.innerHTML = '';
                new QRCode(qrContainer, {
                    text: `${window.location.origin}/?pin=${pin}`,
                    width: 256,
                    height: 256,
                    colorDark: "#0A0608",
                    colorLight: "#FAF5EE"
                });
            }
        });

        let ignoreFirstForzar = true;
        onValue(ref(db, 'comandoForzarFinal'), (snap) => {
            if(ignoreFirstForzar) { ignoreFirstForzar = false; return; }
            if(snap.val() && juegoActivo) {
                EQUIPOS.forEach(eq => { if(!clasificacion.includes(eq.id)) posiciones[eq.id] = 1000; });
            }
        });

        onValue(ref(db, 'estado'), (snap) => {
            const estado = snap.val();
            
            if(estado === 'cerrado') {
                juegoActivo = false;
                document.getElementById('overlay-inicio').style.display = 'none';
                document.getElementById('spotlight-ganador').style.display = 'none';
                document.getElementById('panel-ranking').style.display = 'none';
                document.getElementById('overlay-ruleta').style.display = 'none';
                document.getElementById('contador-tv').style.display = 'none';
                
                document.getElementById('pantalla-limpia').style.display = 'flex'; 
            }
            else if (estado === 'espera') {
                juegoActivo = false; clasificacion = []; tiempoInicio = 0; tiemposFinales = {};
                document.getElementById('pantalla-limpia').style.display = 'none';
                document.getElementById('pista-container').classList.remove('pista-oscura');
                document.getElementById('spotlight-ganador').style.display = 'none';
                document.getElementById('panel-ranking').style.display = 'none';
                document.getElementById('overlay-ruleta').style.display = 'none';
                
                EQUIPOS.forEach(eq => {
                    const el = document.getElementById(`p-${eq.id}`);
                    if(el) { 
                        el.classList.remove('meta-cruzada');
                        el.style.left = eq.inicioX + "vw"; 
                        el.style.filter = "drop-shadow(0 0 12px rgba(255, 209, 102, 0.45))";
                        el.style.zIndex = "10";
                    }
                    anteriorClicks[eq.id] = 0; posiciones[eq.id] = 0;
                });
                
                document.getElementById('contador-tv').style.display = 'none';
                document.getElementById('overlay-inicio').style.display = 'flex';

            } 
            else if (estado === 'cuenta_regresiva') {
                document.getElementById('pantalla-limpia').style.display = 'none';
                document.getElementById('overlay-inicio').style.display = 'none';
                const tv = document.getElementById('contador-tv'); tv.style.display = 'block';
                
                EQUIPOS.forEach(eq => {
                    const data = datosEq[eq.id] || {};
                    snapshotJugadores[eq.id] = (data.jugadores) ? Object.keys(data.jugadores).length : 0;
                    anteriorClicks[eq.id] = data.clicksTotales || 0; 
                });

                let num = 3; tv.innerText = num;
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const beep = (f) => { const o=ctx.createOscillator(); const g=ctx.createGain(); o.type='square'; o.frequency.value=f; g.gain.setValueAtTime(volGlobal*0.5, ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime+0.1); o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime+0.1); };
                beep(440);
                
                const int = setInterval(() => {
                    num--; 
                    if(num > 0) { tv.innerText = num; beep(440); } 
                    else { 
                        clearInterval(int); tv.innerText = "GO!"; beep(880);
                        setTimeout(() => { tv.style.display = 'none'; set(ref(db, 'estado'), 'carrera'); }, 500); 
                    }
                }, 1000);
            }
            else if (estado === 'carrera') { 
                juegoActivo = true; 
                if(tiempoInicio === 0) tiempoInicio = Date.now(); 
            }
        });

        let ignoreFirstRuleta = true;
        onValue(ref(db, 'triggerRuleta'), (snap) => {
            if(ignoreFirstRuleta) { ignoreFirstRuleta = false; return; }
            if(snap.val() && clasificacion.length > 0) {
                document.getElementById('panel-ranking').style.display = 'none'; 
                ejecutarRuletaDigital(clasificacion[0]); 
            }
        });

        function ejecutarRuletaDigital(idEquipoGanador) {
            const overlayRuleta = document.getElementById('overlay-ruleta');
            const displayNombre = document.getElementById('nombre-ruleta');
            overlayRuleta.style.display = 'flex';
            
            const equipoData = datosEq[idEquipoGanador];
            let arrayJugadores = []; 
            if (equipoData && equipoData.jugadores && Object.keys(equipoData.jugadores).length > 0) { 
                arrayJugadores = Object.entries(equipoData.jugadores); 
            } else {
                Object.values(datosEq).forEach(eq => { if(eq.jugadores) arrayJugadores.push(...Object.entries(eq.jugadores)); });
                if(arrayJugadores.length === 0) arrayJugadores = [["NO_ID", "NADIE EN LA SALA"]];
            }
            
            let tiempo = 0; const tiempoMaximo = 4000; const velocidadCambio = 60; 
            displayNombre.classList.add('ruleta-girando');
            
            const intervaloRuleta = setInterval(() => {
                const randomVal = arrayJugadores[Math.floor(Math.random() * arrayJugadores.length)];
                displayNombre.innerText = randomVal[1];
                tiempo += velocidadCambio;
                
                if (tiempo >= tiempoMaximo) {
                    clearInterval(intervaloRuleta);
                    const ganadorFinal = arrayJugadores[Math.floor(Math.random() * arrayJugadores.length)];
                    displayNombre.innerText = ganadorFinal[1];
                    
                    if(ganadorFinal[0] !== "NO_ID") set(ref(db, 'ganadorRuleta'), ganadorFinal[0]);
                    
                    displayNombre.classList.remove('ruleta-girando');
                    displayNombre.classList.add('ruleta-ganador');
                    
                    setTimeout(() => { 
                        overlayRuleta.style.display = 'none'; 
                        document.getElementById('panel-ranking').style.display = 'flex';
                    }, 5000);
                }
            }, velocidadCambio);
        }

        setInterval(() => {
            if(!juegoActivo) return;

            EQUIPOS.forEach((eq) => {
                const id = eq.id; 
                if(clasificacion.includes(id)) return; 
                
                const data = datosEq[id] || { clicksTotales: 0 }; 
                const divisor = Math.max(1, snapshotJugadores[id] || 0);

                const clicksActuales = data.clicksTotales || 0;
                const nuevosClicks = clicksActuales - anteriorClicks[id];
                
                if (nuevosClicks > 0) { posiciones[id] += (nuevosClicks / divisor) * 5; }
                anteriorClicks[id] = clicksActuales; 

                const progreso = Math.min(posiciones[id] / 1000, 1);
                const visualLeft = eq.inicioX + (progreso * (LIMITE_META - eq.inicioX));

                const el = document.getElementById(`p-${id}`);
                if(el) el.style.left = visualLeft + "vw";

                if (posiciones[id] >= 1000) {
                    clasificacion.push(id);
                    tiemposFinales[id] = ((Date.now() - tiempoInicio) / 1000).toFixed(2);
                    set(ref(db, 'clasificacion'), clasificacion); 
                    
                    if(el) {
                        el.style.filter = "";
                        el.classList.add('meta-cruzada');
                    }
                    
                    if (clasificacion.length === EQUIPOS.length) {
                        juegoActivo = false; 
                        set(ref(db, 'ganadorAbsoluto'), clasificacion[0]);
                        audioDrumroll.currentTime = 0; audioDrumroll.play().catch(e=>console.log(e)); 
                        
                        setTimeout(() => { animacionFinalPodio(); }, 4000); 
                    }
                }
            });
        }, 100);

        function animacionFinalPodio() {
            set(ref(db, 'estado'), 'podio');
            document.getElementById('pista-container').classList.add('pista-oscura');
            
            const idGanador = clasificacion[0] || 1;
            const eqGanador = EQUIPOS.find(e => e.id === idGanador);
            
            const spotlight = document.getElementById('spotlight-ganador');
            spotlight.style.display = 'flex';
            
            document.getElementById('sprite-ganador-gigante').innerHTML = `<img src="${eqGanador.asset}" style="height: 50vh; filter: drop-shadow(0 0 30px #fff);">`;
            document.getElementById('txt-ganador-epico').innerHTML = `¡${eqGanador.nombre} GANA<br>EL 1ER LUGAR!`;

            lanzarConfeti();

            setTimeout(() => {
                spotlight.style.display = 'none';
                
                const panel = document.getElementById('panel-ranking');
                const lista = document.getElementById('lista-ranking-final');
                lista.innerHTML = '';
                clasificacion.forEach((id, idx) => {
                    const nom = EQUIPOS.find(e => e.id === id).nombre;
                    const tiempo = tiemposFinales[id] ? tiemposFinales[id] + "s" : "--";
                    const claseCss = (idx === 0) ? 'fila-ranking fila-primero' : 'fila-ranking';
                    
                    lista.innerHTML += `<div class="${claseCss}"><span style="width: 10%;">#${idx+1}</span> <span style="flex-grow: 1; text-align: left; padding-left: 20px;">${nom}</span> <span style="color: #aaa; font-family: 'Arial Black'; font-size: 0.8em;">${tiempo}</span></div>`;
                });
                
                panel.style.display = 'flex';
                panel.style.animation = 'aparecer 1s ease-out forwards';
            }, 5000);
        }
    </script>
</body>
</html>
